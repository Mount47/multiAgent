<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Agent Dev Console</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111b2e;
      --line: #1f3358;
      --text: #e8eefc;
      --muted: #9bb0d9;
      --accent: #49c6e5;
      --ok: #41d39c;
      --err: #ff6f7d;
      --warn: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top right, #15315e, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1440px;
      margin: 20px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 280px 400px 1fr;
      gap: 14px;
      align-items: start;
    }
    .card {
      background: rgba(17, 27, 46, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    label { display: block; margin: 10px 0 5px; color: var(--muted); font-size: 13px; }
    textarea, select, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0a1425;
      color: var(--text);
      padding: 10px;
      font-size: 14px;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      margin-top: 10px;
      background: linear-gradient(90deg, #2282b3, var(--accent));
      color: #041022;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    button:hover { filter: brightness(1.1); }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    .muted { color: var(--muted); font-size: 12px; }
    .status-running { color: var(--accent); }
    .status-completed { color: var(--ok); }
    .status-failed { color: var(--err); }

    /* ── Graph Panel ── */
    .graph-panel {
      display: flex;
      flex-direction: column;
    }
    .graph-panel h1 { margin-bottom: 8px; }
    .graph-container {
      background: #091121;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 6px;
    }
    .graph-container svg { display: block; width: 100%; height: auto; }

    /* SVG node animation */
    @keyframes nodePulse {
      0%, 100% { filter: drop-shadow(0 0 6px var(--accent)); }
      50%      { filter: drop-shadow(0 0 14px var(--accent)); }
    }
    .node-active-glow { animation: nodePulse 1.8s ease-in-out infinite; }

    /* ── Events Panel ── */
    #events {
      height: 74vh;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 13px;
      background: #091121;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--line);
    }
    .event {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #14233f;
    }
    .event .meta { color: var(--muted); font-size: 12px; margin-bottom: 3px; }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .wrap { grid-template-columns: 1fr 1fr; }
      .events-panel { grid-column: 1 / -1; }
      #events { height: 50vh; }
    }
    @media (max-width: 700px) {
      .wrap { grid-template-columns: 1fr; }
      #events { height: 40vh; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="/static/react-app.jsx"></script>
</body>
</html>
