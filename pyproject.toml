[project]
name = "multi-agent-dev"
version = "0.1.0"
description = "Multi-Agent Software Development Collaboration System"
requires-python = ">=3.10"
dependencies = [
    "autogen-agentchat~=0.4",
    "autogen-ext[openai,docker]~=0.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]
memory = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
agent-dev = "src.cli:main"
agent-dev-api = "src.api.app:run"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
